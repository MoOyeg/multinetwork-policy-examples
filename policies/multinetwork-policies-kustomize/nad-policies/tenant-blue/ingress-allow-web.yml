---
object-templates-raw: |
  {{- range $nad := (lookup "k8s.cni.cncf.io/v1" "NetworkAttachmentDefinition" "" "").items }}
  {{- if eq $nad.metadata.name "tenant-blue" }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: k8s.cni.cncf.io/v1beta1
      kind: MultiNetworkPolicy
      metadata:
        name: acm-mnp-tenant-blue
        namespace: '{{ $nad.metadata.namespace }}'
        annotations:
          k8s.v1.cni.cncf.io/policy-for: '{{ $nad.metadata.namespace }}/tenant-blue'
        labels:
          managed-by: acm-multinetpolicy
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
        ingress:
          - from:
              - ipBlock:
                  cidr: '10.0.0.0/24'
                  except:
                    - '10.0.0.5/32'
                    - '10.0.0.6/32'
            ports:
              - port: 443
                protocol: TCP
          - from:
              - ipBlock:
                  cidr: '172.16.0.0/16'
            ports:
              - port: 8080
                protocol: TCP
  {{- end }}
  {{- end }}
