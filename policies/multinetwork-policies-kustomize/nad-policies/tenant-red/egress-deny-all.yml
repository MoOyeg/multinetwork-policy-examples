---
object-templates-raw: |
  {{- range $nad := (lookup "k8s.cni.cncf.io/v1" "NetworkAttachmentDefinition" "" "").items }}
  {{- if eq $nad.metadata.name "tenant-red" }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: k8s.cni.cncf.io/v1beta1
      kind: MultiNetworkPolicy
      metadata:
        name: acm-mnp-tenant-red
        namespace: '{{ $nad.metadata.namespace }}'
        annotations:
          k8s.v1.cni.cncf.io/policy-for: '{{ $nad.metadata.namespace }}/tenant-red'
        labels:
          managed-by: acm-multinetpolicy
      spec:
        podSelector: {}
        policyTypes:
          - Egress
  {{- end }}
  {{- end }}
