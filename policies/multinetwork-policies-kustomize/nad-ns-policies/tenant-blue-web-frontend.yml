---
object-templates-raw: |
  {{- range $nad := (lookup "k8s.cni.cncf.io/v1" "NetworkAttachmentDefinition" "web-frontend" "").items }}
  {{- if eq $nad.metadata.name "tenant-blue" }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: k8s.cni.cncf.io/v1beta1
      kind: MultiNetworkPolicy
      metadata:
        name: acm-mnp-ns-tenant-blue-web-frontend
        namespace: 'web-frontend'
        annotations:
          k8s.v1.cni.cncf.io/policy-for: 'web-frontend/tenant-blue'
        labels:
          managed-by: acm-multinetpolicy
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
        ingress:
          - from:
              - ipBlock:
                  cidr: '0.0.0.0/0'
            ports:
              - port: 4430
                protocol: TCP
  {{- end }}
  {{- end }}
